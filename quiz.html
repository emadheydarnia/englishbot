<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Class Quiz — Emad Eng Lab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0f1729; --panel:#1a2540; --panel2:#243150; --line:#2f3f63;
    --accent:#4f8cff; --gold:#ffd84d; --green:#36c46a; --red:#e25563;
    --text:#eaf1ff; --dim:#9fb3d4;
  }
  html,body{ height:100%; }
  body{ font-family:'Segoe UI',Tahoma,sans-serif;
    background:radial-gradient(circle at 50% 0%, #1a2c52, #0f1729 60%); color:var(--text); }
  /* جلوگیری از انتخاب و کپی */
  .noselect{ -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }
  header{ padding:16px; text-align:center; border-bottom:1px solid var(--line); }
  header h1{ font-size:19px; color:var(--gold); }
  header .sub{ font-size:12px; color:var(--dim); margin-top:3px; }
  .screen{ flex:1; padding:16px; display:none; }
  .screen.active{ display:block; }
  .btn{ background:linear-gradient(#5b96ff,#3f7ae8); color:#fff; border:none; border-radius:12px;
    padding:13px; font-size:15px; font-weight:700; cursor:pointer; width:100%; margin-top:10px; font-family:inherit; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.5; }
  .btn.green{ background:linear-gradient(#42c46a,#2a9d4f); }
  .btn.red{ background:linear-gradient(#e25563,#c13c49); }
  .btn.sec{ background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .quiz-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; }
  .quiz-info{ flex:1; min-width:0; }
  .quiz-title{ font-size:14px; font-weight:600; }
  .quiz-meta{ font-size:11.5px; color:var(--dim); margin-top:3px; }
  .badge{ font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700; white-space:nowrap; }
  .badge.on{ background:rgba(54,196,106,.18); color:var(--green); border:1px solid var(--green); }
  .badge.off{ background:rgba(159,179,212,.12); color:var(--dim); border:1px solid var(--line); }
  .code-box{ background:var(--panel2); border:1px dashed var(--gold); border-radius:10px; padding:10px; text-align:center; margin:10px 0; }
  .code-box .code{ font-size:26px; font-weight:800; color:var(--gold); letter-spacing:4px; direction:ltr; }
  .code-box .lbl{ font-size:11px; color:var(--dim); }
  label.fld{ display:block; font-size:13px; color:var(--dim); margin:12px 0 5px; }
  input.in{ width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px; color:var(--text); font-size:15px; font-family:inherit; }
  input.codeinput{ text-align:center; direction:ltr; letter-spacing:3px; font-size:18px; }
  .msg{ text-align:center; color:var(--dim); font-size:13px; padding:24px 10px; line-height:1.8; }
  .spinner{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; animation:spin 1s linear infinite; margin:30px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .back{ font-size:13px; color:var(--accent); cursor:pointer; margin-bottom:12px; display:inline-block; }
  .err{ color:var(--red); font-size:13px; text-align:center; margin-top:8px; }

  /* بخش آزمون دانشجو */
  .examtop{ position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5;
    display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .examtop .qprog{ font-size:13px; color:var(--dim); }
  .timer{ font-size:15px; font-weight:800; padding:5px 12px; border-radius:20px; direction:ltr;
    background:var(--panel2); border:1px solid var(--accent); color:var(--accent); }
  .timer.warn{ border-color:var(--gold); color:var(--gold); }
  .timer.danger{ border-color:var(--red); color:var(--red); animation:blink 1s infinite; }
  @keyframes blink{ 50%{ opacity:.5; } }
  .qcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .qctx{ font-size:13px; color:var(--dim); font-style:italic; margin-bottom:8px; direction:ltr; text-align:left;
    border-left:2px solid var(--line); padding-left:8px; }
  .qnum{ font-size:12px; color:var(--gold); margin-bottom:6px; }
  .qtext{ font-size:15px; line-height:1.7; direction:ltr; text-align:left; margin-bottom:12px; }
  .ans-in{ width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px; color:var(--text); font-size:15px; direction:ltr; text-align:left; font-family:inherit; }
  .mc-opt{ display:block; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px; margin:6px 0; cursor:pointer; direction:ltr; text-align:left; font-size:14px; transition:all .15s; }
  .mc-opt.sel{ border-color:var(--accent); background:rgba(79,140,255,.16); }
  .watermark{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; opacity:.06; }
  .watermark span{ position:absolute; font-size:15px; color:#fff; white-space:nowrap; transform:rotate(-30deg); }
  .resbig{ font-size:46px; font-weight:800; text-align:center; margin:10px 0; }
  .resbig.good{ color:var(--green); } .resbig.mid{ color:var(--gold); } .resbig.low{ color:var(--red); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📝 Class Quiz</h1>
    <div class="sub" id="sub">آزمون کلاس</div>
  </header>

  <!-- لیست آزمون‌ها (معلم) -->
  <div class="screen active" id="screen-list">
    <div id="list-body"><div class="spinner"></div></div>
  </div>

  <!-- مدیریت یک آزمون (معلم) -->
  <div class="screen" id="screen-manage">
    <span class="back" onclick="showList()">← بازگشت</span>
    <div class="card">
      <div class="quiz-title" id="m-title">—</div>
      <div class="quiz-meta" id="m-meta">—</div>
    </div>
    <div id="m-active-box"></div>
  </div>

  <!-- ورود دانشجو با کد -->
  <div class="screen" id="screen-student">
    <div class="msg">📝 برای شرکت در آزمون، کد دسترسی رو از معلمت بگیر.</div>
    <label class="fld">کد دسترسی:</label>
    <input class="in codeinput" id="student-code" placeholder="----" maxlength="20" inputmode="numeric">
    <button class="btn" id="btn-enter" onclick="studentEnter()">بررسی کد</button>
    <div class="err" id="student-err"></div>
  </div>

  <!-- اطلاعات دانشجو (اسم + کلاس) -->
  <div class="screen" id="screen-info">
    <div class="card">
      <div class="quiz-title" id="i-title">—</div>
      <div class="quiz-meta" id="i-meta">—</div>
    </div>
    <label class="fld">نام و نام خانوادگی:</label>
    <input class="in" id="i-name" placeholder="مثلاً علی رضایی">
    <label class="fld">شماره کلاس:</label>
    <input class="in" id="i-class" placeholder="مثلاً 1404">
    <button class="btn green" id="btn-begin" onclick="beginExam()">شروع آزمون ▶️</button>
    <div class="msg" style="padding:10px;font-size:12px">⚠️ با شروع آزمون، تایمر شروع می‌شه و کپی/پیست غیرفعاله.</div>
    <div class="err" id="info-err"></div>
  </div>

  <!-- آزمون (تک‌سوالی) -->
  <div class="screen" id="screen-exam">
    <div class="examtop">
      <span class="qprog" id="e-prog">سوال ۱</span>
      <span class="timer" id="e-timer">--:--</span>
    </div>
    <div id="e-onequestion"></div>
    <button class="btn green" id="btn-next" onclick="nextQuestion()">بعدی ◀️</button>
    <div class="msg" id="e-warn" style="font-size:12px"></div>
  </div>

  <!-- نتیجه -->
  <div class="screen" id="screen-result">
    <div class="card" style="text-align:center">
      <div style="font-size:14px;color:var(--dim)">نمره‌ی تو</div>
      <div class="resbig" id="r-score">0</div>
      <div style="font-size:13px;color:var(--dim)" id="r-detail">—</div>
    </div>
    <div class="msg">✅ آزمونت ثبت شد. نتیجه و فایل کامل به‌زودی برات میاد.</div>
  </div>
</div>

<div class="watermark" id="watermark"></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }
const INIT = tg ? tg.initData : "";
let QUIZZES=[], SUGGESTED="", curQuiz=null;
let examData=null, examAns={}, examTimer=null, examLeft=0, examExits=0, qStart={}, examActiveQ=null;

async function api(path, body){
  const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({initData:INIT}, body||{}))});
  if(!res.ok){ const e=await res.json().catch(()=>({error:'http_'+res.status})); throw new Error(e.error||'error'); }
  return res.json();
}
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active'); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function faN(n){ return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }

/* ---------- معلم ---------- */
async function loadList(){
  const body=document.getElementById('list-body');
  body.innerHTML='<div class="spinner"></div>';
  try{
    const r=await api('/api/quiz/teacher/list',{});
    QUIZZES=r.quizzes; SUGGESTED=r.suggested_code;
    document.getElementById('sub').textContent='پنل معلم · '+QUIZZES.length+' آزمون';
    if(!QUIZZES.length){ body.innerHTML='<div class="msg">هنوز آزمونی وارد نشده.</div>'; return; }
    body.innerHTML=QUIZZES.map(q=>
      '<div class="card quiz-row" onclick="openQuiz('+q.id+')">'+
        '<div class="quiz-info"><div class="quiz-title">'+esc(q.title)+'</div>'+
        '<div class="quiz-meta">'+faN(q.nq)+' سوال · '+faN(q.duration_min)+' دقیقه · '+faN(q.nsub)+' پاسخ</div></div>'+
        '<span class="badge '+(q.is_active?'on':'off')+'">'+(q.is_active?'🟢 فعال':'🔒 قفل')+'</span>'+
      '</div>').join('');
  }catch(e){
    if(e.message==='teacher_only'){ body.innerHTML='<div class="msg">🔒 این پنل فقط برای معلم است.</div>'; return; }
    body.innerHTML='<div class="err">خطا: '+e.message+'</div>';
  }
}
function showList(){ show('screen-list'); loadList(); }
function openQuiz(id){
  curQuiz=QUIZZES.find(q=>q.id===id); if(!curQuiz) return;
  show('screen-manage');
  document.getElementById('m-title').textContent=curQuiz.title;
  document.getElementById('m-meta').textContent=faN(curQuiz.nq)+' سوال · '+faN(curQuiz.duration_min)+' دقیقه · '+faN(curQuiz.nsub)+' پاسخ';
  renderActiveBox();
}
function renderActiveBox(){
  const box=document.getElementById('m-active-box');
  if(curQuiz.is_active){
    box.innerHTML='<div class="code-box"><div class="lbl">کد دسترسی فعلی</div><div class="code">'+esc(curQuiz.access_code||'----')+'</div></div>'+
      '<div class="msg" style="padding:8px">این کد رو به دانشجوها بده. وقتی تموم شد، غیرفعالش کن.</div>'+
      '<button class="btn red" onclick="deactivate()">🔒 غیرفعال کردن</button>';
  } else {
    box.innerHTML='<div style="margin:10px 0 6px;font-size:13px;color:var(--dim)">کد دسترسی (قابل تغییر):</div>'+
      '<input class="in codeinput" id="codein" value="'+esc(SUGGESTED)+'" maxlength="20">'+
      '<button class="btn green" onclick="activate()">🟢 فعال کردن</button>'+
      '<div class="msg" style="padding:8px;font-size:12px">با فعال کردن این، بقیه‌ی آزمون‌ها قفل می‌شن.</div>';
  }
}
async function activate(){
  const code=(document.getElementById('codein').value||'').trim();
  try{ const r=await api('/api/quiz/teacher/activate',{quiz_id:curQuiz.id, code:code});
    curQuiz.is_active=true; curQuiz.access_code=r.code; renderActiveBox();
  }catch(e){ alert('خطا: '+e.message); }
}
async function deactivate(){
  try{ await api('/api/quiz/teacher/deactivate',{quiz_id:curQuiz.id});
    curQuiz.is_active=false; renderActiveBox();
  }catch(e){ alert('خطا: '+e.message); }
}

/* ---------- دانشجو ---------- */
async function studentEnter(){
  const code=(document.getElementById('student-code').value||'').trim();
  const errEl=document.getElementById('student-err'); errEl.textContent='';
  if(!code){ errEl.textContent='کد رو وارد کن.'; return; }
  document.getElementById('btn-enter').disabled=true;
  try{
    const r=await api('/api/quiz/student/enter',{code:code});
    curQuiz={id:r.quiz_id, title:r.title, code:code};
    document.getElementById('i-title').textContent=r.title;
    document.getElementById('i-meta').textContent=faN(r.num_questions)+' سوال · '+faN(r.duration_min)+' دقیقه';
    show('screen-info');
  }catch(e){
    if(e.message==='bad_code') errEl.textContent='کد اشتباهه یا آزمون فعال نیست.';
    else if(e.message==='already_done') errEl.textContent='تو قبلاً این آزمون رو دادی.';
    else errEl.textContent='خطا: '+e.message;
  }finally{ document.getElementById('btn-enter').disabled=false; }
}

async function beginExam(){
  const name=(document.getElementById('i-name').value||'').trim();
  const cls=(document.getElementById('i-class').value||'').trim();
  const errEl=document.getElementById('info-err'); errEl.textContent='';
  if(!name || !cls){ errEl.textContent='اسم و شماره کلاس رو پر کن.'; return; }
  document.getElementById('btn-begin').disabled=true;
  try{
    const r=await api('/api/quiz/student/start',{code:curQuiz.code, name:name, class_no:cls});
    examData=r; examAns={}; examExits=0; qStart={}; curIdx=0; qExtra=false;
    setupWatermark(r.watermark);
    show('screen-exam');
    enableAntiCheat();
    renderOneQuestion();
  }catch(e){
    if(e.message==='need_info') errEl.textContent='اسم و شماره کلاس رو پر کن.';
    else if(e.message==='bad_code') errEl.textContent='آزمون دیگه فعال نیست.';
    else errEl.textContent='خطا: '+e.message;
    document.getElementById('btn-begin').disabled=false;
  }
}

function setupWatermark(text){
  const wm=document.getElementById('watermark'); wm.innerHTML='';
  for(let r=0;r<8;r++) for(let c=0;c<4;c++){
    const s=document.createElement('span');
    s.textContent='ID '+text;
    s.style.top=(r*13)+'%'; s.style.left=(c*30-5)+'%';
    wm.appendChild(s);
  }
}

const Q_SECONDS=60, Q_EXTRA=15;
let curIdx=0, qExtra=false;

function renderOneQuestion(){
  const q=examData.questions[curIdx];
  document.getElementById('e-prog').textContent='سوال '+faN(curIdx+1)+' از '+faN(examData.questions.length);
  document.getElementById('e-warn').textContent='';
  const box=document.getElementById('e-onequestion');
  let html='<div class="qcard">';
  if(q.context) html+='<div class="qctx">'+esc(q.context)+'</div>';
  html+='<div class="qtext">'+esc(q.question)+'</div>';
  if(q.qtype==='mc' && q.options && q.options.length){
    html+='<div class="mc-wrap">';
    q.options.forEach(opt=>{
      const sel=(examAns[q.qnum]===opt)?' sel':'';
      html+='<label class="mc-opt'+sel+'" onclick="pickMC('+q.qnum+',this,\''+esc(opt).replace(/'/g,"\\'")+'\')">'+esc(opt)+'</label>';
    });
    html+='</div>';
  } else {
    const val=examAns[q.qnum]?(' value="'+esc(examAns[q.qnum])+'"'):'';
    html+='<input class="ans-in" id="ans-cur" placeholder="جوابت رو تایپ کن..."'+val+
          ' oninput="onAns('+q.qnum+',this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
  }
  html+='</div>';
  box.innerHTML=html;
  // دکمه: آخرین سوال = تحویل
  const btn=document.getElementById('btn-next');
  btn.textContent=(curIdx>=examData.questions.length-1)?'تحویل آزمون ✅':'بعدی ◀️';
  qStart[q.qnum]=Date.now();
  startQTimer();
}
function onAns(qn,val){ examAns[qn]=val; }
function pickMC(qn, el, val){
  examAns[qn]=val;
  el.parentElement.querySelectorAll('.mc-opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
}

function startQTimer(){
  if(examTimer) clearInterval(examTimer);
  examLeft=Q_SECONDS; qExtra=false; updTimer();
  examTimer=setInterval(()=>{
    examLeft--; updTimer();
    if(examLeft<=0){
      if(!qExtra){
        qExtra=true; examLeft=Q_EXTRA;
        document.getElementById('e-warn').textContent='⏰ وقت سوال تموم شد! '+faN(Q_EXTRA)+' ثانیه‌ی آخر.';
        try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning'); }catch(e){}
      } else {
        clearInterval(examTimer); goNext(true);
      }
    }
  },1000);
}
function updTimer(){
  const el=document.getElementById('e-timer');
  el.textContent=faN(String(examLeft).padStart(2,'0'))+'s';
  el.classList.remove('warn','danger');
  if(qExtra||examLeft<=10) el.classList.add('danger'); else if(examLeft<=20) el.classList.add('warn');
}

function nextQuestion(){ goNext(false); }
function goNext(timedOut){
  if(examTimer) clearInterval(examTimer);
  // ثبت زمان این سوال
  const q=examData.questions[curIdx];
  if(qStart[q.qnum]) qTimes[q.qnum]=Math.round((Date.now()-qStart[q.qnum])/1000);
  if(curIdx>=examData.questions.length-1){
    doSubmit();  // آخرین سوال
  } else {
    curIdx++; renderOneQuestion();
  }
}

/* ضدتقلب */
function enableAntiCheat(){
  document.addEventListener('contextmenu', preventEvt);
  document.addEventListener('copy', preventEvt);
  document.addEventListener('cut', preventEvt);
  document.addEventListener('paste', preventEvt);
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('noselect'));
  document.addEventListener('visibilitychange', onVis);
}
function disableAntiCheat(){
  document.removeEventListener('contextmenu', preventEvt);
  document.removeEventListener('copy', preventEvt);
  document.removeEventListener('cut', preventEvt);
  document.removeEventListener('paste', preventEvt);
  document.removeEventListener('visibilitychange', onVis);
}
function preventEvt(e){ e.preventDefault(); return false; }
function onVis(){
  if(document.hidden){
    examExits++;
    const q=examData.questions[curIdx];
    if(q){ exitPerQ[q.qnum]=(exitPerQ[q.qnum]||0)+1; }
    try{ if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning'); }catch(e){}
  }
}

let submitting=false;
const qTimes={}, exitPerQ={};
function autoSubmit(){ if(!submitting){ doSubmit(); } }
async function doSubmit(){
  if(submitting) return;
  submitting=true;
  if(examTimer) clearInterval(examTimer);
  disableAntiCheat();
  const btn=document.getElementById('btn-next');
  btn.disabled=true; btn.textContent='در حال ثبت...';
  try{
    const r=await api('/api/quiz/student/submit',{
      quiz_id:examData.quiz_id, answers:examAns, exits:examExits,
      q_times:qTimes, exit_per_q:exitPerQ});
    document.getElementById('watermark').innerHTML='';
    const sc=r.score100;
    const el=document.getElementById('r-score');
    el.textContent=faN(sc); el.className='resbig '+(sc>=70?'good':(sc>=50?'mid':'low'));
    document.getElementById('r-detail').textContent=faN(r.score)+' از '+faN(r.total)+' درست';
    show('screen-result');
  }catch(e){
    alert('خطا در ثبت: '+e.message);
    btn.disabled=false; btn.textContent='تحویل آزمون ✅';
    submitting=false;
  }
}

/* ---------- boot ---------- */
async function boot(){
  if(!INIT){ document.getElementById('list-body').innerHTML='<div class="err">لطفاً از داخل تلگرام باز کن.</div>'; return; }
  try{
    const who=await api('/api/quiz/whoami',{});
    if(who.is_teacher){ document.getElementById('sub').textContent='پنل معلم'; loadList(); }
    else { show('screen-student'); document.getElementById('sub').textContent='شرکت در آزمون'; }
  }catch(e){ show('screen-student'); }
}
boot();
</script>
</body>
</html>
